[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplify-backend"
version = "1.0.0"
description = "InfoVision Amplify Platform — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "azure-identity==1.19.0",
    "azure-keyvault-secrets==4.9.0",
    "azure-storage-blob==12.23.1",
    "azure-communication-email==1.0.0",
    "google-generativeai==0.8.3",
    "websockets==13.1",
    "cryptography==43.0.3",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.7.0",
    "mypy==1.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4"]
ignore = ["S101", "B008", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
