<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark navy background -->
  <rect width="100" height="100" rx="15" fill="#0d1b2e"/>

  <!-- Left white chevron peak (^) -->
  <polyline points="6,82 28,20 50,82"
    fill="none" stroke="white" stroke-width="7.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right white chevron peak (^) -->
  <polyline points="50,82 72,20 94,82"
    fill="none" stroke="white" stroke-width="7.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Red diagonal upward arrow shaft (overlaid on right chevron) -->
  <line x1="54" y1="74" x2="80" y2="16"
    stroke="#cc2222" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Red arrowhead at top-right -->
  <polyline points="66,12 81,16 77,31"
    fill="none" stroke="#cc2222" stroke-width="7.5"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
